apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-ai-api
  labels:
    app: enterprise-ai-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: enterprise-ai-api
  template:
    metadata:
      labels:
        app: enterprise-ai-api
    spec:
      containers:
        - name: api
          image: enterprise-ai-os:latest
          ports:
            - containerPort: 8060
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: enterprise-ai-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: enterprise-ai-secrets
                  key: redis-url
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: enterprise-ai-secrets
                  key: jwt-secret-key
            - name: APP_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: enterprise-ai-secrets
                  key: app-secret-key
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: enterprise-ai-secrets
                  key: openai-api-key
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-ai-api
spec:
  selector:
    app: enterprise-ai-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: enterprise-ai-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: enterprise-ai-api
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
