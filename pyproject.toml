[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-os"
version = "1.0.0"
description = "Enterprise AI Operating System — multi-tenant, multi-industry AI platform"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",

    # Async DB
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",

    # Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "email-validator>=2.1.1",

    # Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "authlib>=1.3.0",

    # Cache
    "redis[hiredis]>=5.0.4",

    # AI providers
    "openai>=1.30.0",
    "anthropic>=0.26.0",
    "google-generativeai>=0.5.4",
    "ollama>=0.2.1",

    # Embeddings & vector stores
    "pgvector>=0.2.5",
    "qdrant-client>=1.9.1",
    "tiktoken>=0.7.0",

    # RAG / document processing
    "langchain>=0.2.3",
    "langchain-openai>=0.1.8",
    "langchain-community>=0.2.4",
    "pypdf2>=3.0.1",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.4",
    "unstructured>=0.14.6",

    # Search
    "elasticsearch[async]>=8.13.1",

    # Messaging
    "aiokafka>=0.10.0",
    "aio-pika>=9.4.1",

    # Storage
    "boto3>=1.34.0",
    "azure-storage-blob>=12.20.0",
    "google-cloud-storage>=2.16.0",

    # Observability
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "prometheus-client>=0.20.0",
    "structlog>=24.1.0",

    # GraphQL
    "strawberry-graphql[fastapi]>=0.227.0",

    # gRPC
    "grpcio>=1.64.0",
    "grpcio-tools>=1.64.0",

    # HTTP client
    "httpx>=0.27.0",

    # Utilities
    "python-slugify>=8.0.4",
    "arrow>=1.3.0",
    "tenacity>=8.3.0",
    "celery[redis]>=5.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "faker>=25.2.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "pre-commit>=3.7.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
